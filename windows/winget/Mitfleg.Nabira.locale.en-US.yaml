ShortDescription: Fixes text typed in the wrong keyboard layout — a free PuntoSwitcher alternative.
Description: >-
  Nabira fixes text typed in the wrong keyboard layout. Press the trigger (double-tap Ctrl by
  default) to convert the last word, the selection, or the whole line into the other layout, and to
  switch the keyboard. It also offers smart per-word conversion, as-you-type auto conversion (beta),
  a layout-switch hotkey, and per-app layout memory. Zero dependencies, portable, open source.
