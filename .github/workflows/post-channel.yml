name: Post to channel

# Разовый ручной пост в Telegram-канал @RuSwitcher (напр. приветственное сообщение).
# Токен берётся из секрета TELEGRAM_BOT_TOKEN (бот @EcoDrotBot, админ канала).
# Запуск: gh workflow run post-channel.yml [-f file=telegram/welcome.md]

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Файл с текстом поста"
        required: false
        default: "telegram/welcome.md"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post message to Telegram channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@RuSwitcher"
          MESSAGE_FILE: ${{ github.event.inputs.file }}
        run: python3 scripts/post_channel.py
