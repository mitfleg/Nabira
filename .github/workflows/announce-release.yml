name: Announce release

# Постим в Telegram-канал @RuSwitcher при публикации СТАБИЛЬНОГО релиза.
# Беты (pre-release) пропускаем — канал только для стабильных версий.
# Требует: бот @EcoDrotBot (секрет TELEGRAM_BOT_TOKEN) добавлен АДМИНОМ канала @RuSwitcher.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Announce to Telegram channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@RuSwitcher"
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: python3 scripts/announce_release.py
