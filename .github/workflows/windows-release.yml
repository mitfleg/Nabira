name: windows-release

# Builds, packages, (optionally) signs and publishes a Windows release.
# Triggered by pushing a tag like `win-v0.9.0` (the Windows track is versioned separately from the
# macOS `vX.Y.Z` tags). Publishing is therefore an explicit, human action: pushing the tag.
#
# Code signing is OPTIONAL and gated on a certificate secret being present (mirrors how the macOS
# build only notarizes when credentials exist). Without a cert the release still ships, unsigned;
# SmartScreen will warn until a cert is added (secrets WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD).
on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.9.0), for manual runs'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^win-v',''
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $pre = if ($v -like '0.*') { 'true' } else { 'false' }
          "prerelease=$pre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v prerelease=$pre"

      - name: Test
        run: dotnet test windows/tests/RuSwitcher.Win.Tests/RuSwitcher.Win.Tests.csproj -c Release --nologo

      - name: Publish single-file exe (x64)
        run: >
          dotnet publish windows/src/RuSwitcher.Win/RuSwitcher.Win.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/x64 --nologo

      - name: Publish single-file exe (arm64)
        run: >
          dotnet publish windows/src/RuSwitcher.Win/RuSwitcher.Win.csproj
          -c Release -r win-arm64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/arm64 --nologo

      # --- optional code signing (only if a cert secret is configured) ---
      - name: Import signing certificate
        id: cert
        if: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          "pfx=$pfx" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}

      - name: Sign exes
        if: ${{ steps.cert.outputs.pfx != '' }}
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          foreach ($exe in @("publish\x64\RuSwitcher.exe","publish\arm64\RuSwitcher.exe")) {
            & $signtool sign /f "${{ steps.cert.outputs.pfx }}" /p "$env:CERT_PW" `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
          }
        env:
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
                  "/DSourceExe=publish\x64\RuSwitcher.exe" `
                  windows\installer\RuSwitcher.iss
          # ISCC writes to windows\installer\dist\
          Get-ChildItem windows\installer\dist

      - name: Sign installer
        if: ${{ steps.cert.outputs.pfx != '' }}
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          Get-ChildItem windows\installer\dist\*.exe | ForEach-Object {
            & $signtool sign /f "${{ steps.cert.outputs.pfx }}" /p "$env:CERT_PW" `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
        env:
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Stage assets + checksums
        id: assets
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item publish\x64\RuSwitcher.exe   "assets\RuSwitcher-$v-win-x64.exe"
          Copy-Item publish\arm64\RuSwitcher.exe "assets\RuSwitcher-$v-win-arm64.exe"
          Copy-Item windows\installer\dist\*.exe assets\ -ErrorAction SilentlyContinue
          $lines = @()
          Get-ChildItem assets | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii assets\SHA256SUMS.txt
          Get-Content assets\SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $pre = if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { '--prerelease' } else { '' }
          $notes = "RuSwitcher for Windows $v`n`nAssets: portable single-file exe (x64/arm64) and an installer.`n`nSHA256:`n" + (Get-Content assets\SHA256SUMS.txt -Raw)
          $notes | Out-File -Encoding utf8 notes.md
          gh release create "win-v$v" (Get-ChildItem assets\* | ForEach-Object { $_.FullName }) `
            --title "RuSwitcher for Windows $v" --notes-file notes.md $pre
