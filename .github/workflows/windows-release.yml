name: windows-release

# Builds, packages, signs when a trusted provider is configured, and publishes a Windows release.
# Triggered by pushing a tag like `win-v0.9.0` (the Windows track is versioned separately from the
# macOS `vX.Y.Z` tags). Publishing is therefore an explicit, human action: pushing the tag.
#
# SignPath remains supported if a future application is approved. A conventional PFX certificate
# is also supported. Until either provider is configured the workflow can produce an unsigned beta
# build, while stable releases fail closed without a trusted signer.
on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.9.0), for manual runs'
        required: true
      channel:
        description: 'Update channel'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # `secrets` is NOT available in a step-level `if:` (it errors the whole run at parse time), but a
    # job-level `env` MAY read secrets — so provider selection is hoisted here.
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' && vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG != '' && vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG != '' }}
      HAS_PFX_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
            $channel = '${{ github.event.inputs.channel }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^win-v',''
            $channel = 'stable'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $feedAsset = if ($channel -eq 'beta') { 'windows-version-beta.json' } else { 'windows-version.json' }
          $releaseTag = if ($channel -eq 'beta') { "win-beta-v$v" } else { "win-v$v" }
          "feed_asset=$feedAsset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $pre = if ($channel -eq 'beta' -or $v -like '0.*') { 'true' } else { 'false' }
          "prerelease=$pre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v channel=$channel prerelease=$pre"

      - name: Resolve signing provider
        id: signing
        shell: pwsh
        run: |
          if ($env:HAS_SIGNPATH -eq 'true') {
            $provider = 'SignPath Foundation'
            $trusted = 'true'
          } elseif ($env:HAS_PFX_CERT -eq 'true') {
            $provider = 'PFX certificate'
            $trusted = 'true'
          } else {
            $provider = 'unsigned'
            $trusted = 'false'
          }
          "provider=$provider" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "trusted=$trusted" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Windows release signing provider: $provider"

      - name: Require a trusted signer for stable releases
        if: steps.ver.outputs.channel == 'stable' && steps.signing.outputs.trusted != 'true'
        shell: pwsh
        run: throw 'Stable Windows releases require SignPath Foundation or a trusted PFX certificate.'

      - name: Test
        run: dotnet test windows/tests/Nabira.Win.Tests/Nabira.Win.Tests.csproj -c Release --nologo

      - name: Publish single-file exe (x64)
        run: >
          dotnet publish windows/src/Nabira.Win/Nabira.Win.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0
          -p:FileVersion=${{ steps.ver.outputs.version }}.0
          -p:InformationalVersion=${{ steps.ver.outputs.version }}
          -o publish/x64 --nologo

      - name: Publish single-file exe (arm64)
        run: >
          dotnet publish windows/src/Nabira.Win/Nabira.Win.csproj
          -c Release -r win-arm64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0
          -p:FileVersion=${{ steps.ver.outputs.version }}.0
          -p:InformationalVersion=${{ steps.ver.outputs.version }}
          -o publish/arm64 --nologo

      - name: Verify executable metadata
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          foreach ($exe in @('publish\x64\Nabira.exe', 'publish\arm64\Nabira.exe')) {
            $info = (Get-Item $exe).VersionInfo
            if ($info.ProductName -ne 'Nabira') { throw "$exe ProductName is '$($info.ProductName)'" }
            if ($info.CompanyName -ne 'Nabira') { throw "$exe CompanyName is '$($info.CompanyName)'" }
            if ($info.ProductVersion -ne $version) { throw "$exe ProductVersion is '$($info.ProductVersion)'" }
            if ($info.FileVersion -ne "$version.0") { throw "$exe FileVersion is '$($info.FileVersion)'" }
            Write-Host "$exe metadata verified: product $($info.ProductVersion), file $($info.FileVersion)"
          }

      # --- SignPath Foundation (preferred trusted signer) ---
      - name: Stage application executables for SignPath
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signpath\apps | Out-Null
          Copy-Item publish\x64\Nabira.exe signpath\apps\Nabira-win-x64.exe
          Copy-Item publish\arm64\Nabira.exe signpath\apps\Nabira-win-arm64.exe

      - name: Upload unsigned application executables
        id: signpath-apps-upload
        if: env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nabira-windows-apps-unsigned
          path: signpath/apps/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign application executables with SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-apps-upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signpath/apps-signed
          parameters: |
            version: "${{ steps.ver.outputs.version }}"

      - name: Install SignPath-signed application executables
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          Copy-Item signpath\apps-signed\Nabira-win-x64.exe publish\x64\Nabira.exe -Force
          Copy-Item signpath\apps-signed\Nabira-win-arm64.exe publish\arm64\Nabira.exe -Force

      # --- conventional PFX fallback ---
      - name: Import signing certificate
        id: cert
        if: env.HAS_SIGNPATH != 'true' && env.HAS_PFX_CERT == 'true'
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          "pfx=$pfx" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}

      - name: Sign exes
        if: env.HAS_SIGNPATH != 'true' && steps.cert.outputs.pfx != ''
        shell: pwsh
        run: |
          # The SDK bin dir holds both versioned dirs (10.0.22621.0) AND legacy arch dirs (x64/x86/arm);
          # a plain name-descending sort picks a letter dir → bogus path. Filter to versioned dirs.
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Where-Object { $_.Name -match '^\d+\.\d+\.\d+' } |
                 Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          foreach ($exe in @("publish\x64\Nabira.exe","publish\arm64\Nabira.exe")) {
            & $signtool sign /f "${{ steps.cert.outputs.pfx }}" /p "$env:CERT_PW" `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
          }
        env:
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # The .iss uses ArchitecturesAllowed=x64compatible (Inno Setup 6.3+). windows-latest ships a
          # newer Inno; upgrade is idempotent (no-ops when current) and installs it if ever missing.
          choco upgrade innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # SourceExe MUST be absolute: ISCC resolves relative [Files] Source paths against the .iss
          # file's own directory (windows\installer), not the workflow working directory.
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
                  "/DSourceExe=${{ github.workspace }}\publish\x64\Nabira.exe" `
                  windows\installer\Nabira.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          # ISCC writes to windows\installer\dist\
          Get-ChildItem windows\installer\dist

      - name: Upload unsigned installer
        id: signpath-installer-upload
        if: env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nabira-windows-installer-unsigned
          path: windows/installer/dist/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer with SignPath
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-installer-upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signpath/installer-signed
          parameters: |
            version: "${{ steps.ver.outputs.version }}"

      - name: Install SignPath-signed installer
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signpath\installer-signed\*.exe
          if ($signed.Count -ne 1) { throw "Expected one signed installer, got $($signed.Count)" }
          Copy-Item $signed[0].FullName windows\installer\dist\ -Force

      - name: Sign installer
        if: env.HAS_SIGNPATH != 'true' && steps.cert.outputs.pfx != ''
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Where-Object { $_.Name -match '^\d+\.\d+\.\d+' } |
                 Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          Get-ChildItem windows\installer\dist\*.exe | ForEach-Object {
            & $signtool sign /f "${{ steps.cert.outputs.pfx }}" /p "$env:CERT_PW" `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
        env:
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Verify trusted Authenticode signatures
        if: steps.signing.outputs.trusted == 'true'
        shell: pwsh
        run: |
          $targets = @('publish\x64\Nabira.exe', 'publish\arm64\Nabira.exe')
          $targets += (Get-ChildItem windows\installer\dist\*.exe | ForEach-Object { $_.FullName })
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target
            if ($signature.Status -ne 'Valid') {
              throw "$target has invalid Authenticode status: $($signature.Status)"
            }
            Write-Host "$target signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Stage assets + checksums
        id: assets
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item publish\x64\Nabira.exe   "assets\Nabira-$v-win-x64.exe"
          Copy-Item publish\arm64\Nabira.exe "assets\Nabira-$v-win-arm64.exe"
          if (-not (Test-Path windows\installer\dist\*.exe)) { throw 'installer was not built' }
          Copy-Item windows\installer\dist\*.exe assets\
          $lines = @()
          Get-ChildItem assets | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii assets\SHA256SUMS.txt
          Get-Content assets\SHA256SUMS.txt

      - name: Create signed update feed
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.NABIRA_UPDATE_SIGNING_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)) {
            throw 'NABIRA_UPDATE_SIGNING_KEY_PEM is required for a releasable Windows build'
          }
          $v = '${{ steps.ver.outputs.version }}'
          $key = Join-Path $env:RUNNER_TEMP 'nabira-update-signing-private.pem'
          [IO.File]::WriteAllText($key, $env:UPDATE_SIGNING_KEY, [Text.UTF8Encoding]::new($false))
          try {
            $channel = '${{ steps.ver.outputs.channel }}'
            $feedAsset = '${{ steps.ver.outputs.feed_asset }}'
            $feedPath = "assets\$feedAsset"
            $feedSource = if ($channel -eq 'beta') { 'windows\version-beta.json' } else { 'windows\version.json' }
            $downloadPath = if ($channel -eq 'beta') { 'downloads/beta/Nabira-Windows-x64.exe' } else { 'downloads/Nabira-Windows-x64.exe' }
            $feed = Get-Content $feedSource -Raw | ConvertFrom-Json
            $feed.version = $v
            $feed.url = "https://nabira.site/$downloadPath`?version=$v"
            $feed.sha256 = (Get-FileHash publish\x64\Nabira.exe -Algorithm SHA256).Hash.ToLower()
            $feed | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $feedPath
            python scripts\update_feed.py sign --platform windows --channel $channel --key $key --feed $feedPath
            python scripts\update_feed.py verify --platform windows --channel $channel `
              --public-key shared\update-signing-public.pem --feed $feedPath
            $feedHash = (Get-FileHash $feedPath -Algorithm SHA256).Hash.ToLower()
            "$feedHash  $feedAsset" | Out-File -Append -Encoding ascii assets\SHA256SUMS.txt
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $channel = '${{ steps.ver.outputs.channel }}'
          $label = if ($channel -eq 'beta') { ' beta' } else { '' }
          $signing = '${{ steps.signing.outputs.provider }}'
          $policy = 'https://github.com/mitfleg/Nabira/blob/main/CODE_SIGNING_POLICY.md'
          $notes = "Nabira for Windows $v$label`n`nAssets: portable single-file exe (x64/arm64) and an installer.`nSigning: $signing.`nCode signing policy: $policy`n`nSHA256:`n" + (Get-Content assets\SHA256SUMS.txt -Raw)
          $notes | Out-File -Encoding utf8 notes.md
          # Build the arg list explicitly: an empty '$pre' would otherwise reach gh as an empty
          # positional (a bogus asset path) and fail the first stable release. --target pins the tag to
          # the built commit (matters on the workflow_dispatch path, which creates the tag).
          $ghArgs = @('${{ steps.ver.outputs.release_tag }}') + (Get-ChildItem assets\* | ForEach-Object { $_.FullName }) +
                    @('--title', "Nabira for Windows $v$label", '--notes-file', 'notes.md',
                      '--target', '${{ github.sha }}')
          if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
