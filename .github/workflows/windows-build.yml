name: windows-build

# Builds the Windows version on a real Windows runner — the only way to verify it,
# since the maintainer works on macOS. Also the project's first build CI (the audit
# flagged that pushes were never compile-checked).
on:
  push:
    branches: [wip/windows, main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build windows/src/Nabira.Win/Nabira.Win.csproj -c Release --nologo

      - name: Test (pure-logic unit tests)
        run: dotnet test windows/tests/Nabira.Win.Tests/Nabira.Win.Tests.csproj -c Release --nologo

      # Self-contained single .exe — runs on any Windows x64 without installing .NET.
      # Download it from this run's "Artifacts" section to test on a real machine.
      - name: Publish single-file exe
        run: >
          dotnet publish windows/src/Nabira.Win/Nabira.Win.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish --nologo

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nabira-win-x64
          path: publish/Nabira.exe
          if-no-files-found: error
