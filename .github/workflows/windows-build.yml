name: windows-build

# Builds the Windows version on a real Windows runner — the only way to verify it,
# since the maintainer works on macOS. Also the project's first build CI (the audit
# flagged that pushes were never compile-checked).
on:
  push:
    branches: [wip/windows, main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build windows/src/Nabira.Win/Nabira.Win.csproj -c Release --nologo

      - name: Test (pure-logic unit tests)
        run: dotnet test windows/tests/Nabira.Win.Tests/Nabira.Win.Tests.csproj -c Release --nologo

      # Self-contained single .exe — runs on any Windows x64 without installing .NET.
      # Download it from this run's "Artifacts" section to test on a real machine.
      - name: Publish single-file exe
        run: >
          dotnet publish windows/src/Nabira.Win/Nabira.Win.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish --nologo

      - name: Verify release metadata
        id: metadata
        shell: pwsh
        run: |
          $info = (Get-Item publish\Nabira.exe).VersionInfo
          if ($info.ProductName -ne 'Nabira') { throw "ProductName is '$($info.ProductName)'" }
          if ($info.CompanyName -ne 'Nabira') { throw "CompanyName is '$($info.CompanyName)'" }
          if ([string]::IsNullOrWhiteSpace($info.ProductVersion)) { throw 'ProductVersion is empty' }
          "version=$($info.ProductVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Nabira $($info.ProductVersion), file $($info.FileVersion)"

      - name: Build installer validation
        shell: pwsh
        run: |
          choco upgrade innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.metadata.outputs.version }}" `
                  "/DSourceExe=${{ github.workspace }}\publish\Nabira.exe" `
                  windows\installer\Nabira.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          if (-not (Test-Path windows\installer\dist\*.exe)) { throw 'installer was not built' }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nabira-win-x64
          path: publish/Nabira.exe
          if-no-files-found: error
